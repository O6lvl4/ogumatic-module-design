[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogumatic"
version = "0.2.0"
description = "Ogumatic Module Design の眼。言語非依存の中核と正規表現の抽出器"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
ogumatic = "ogumatic_eye.cli.cli:main"

[tool.setuptools]
package-dir = {"" = "eye"}
packages = ["ogumatic_eye", "ogumatic_eye.vocab", "ogumatic_eye.fsmirror", "ogumatic_eye.loader",
            "ogumatic_eye.extract", "ogumatic_eye.checks", "ogumatic_eye.registry", "ogumatic_eye.cli"]
