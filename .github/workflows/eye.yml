name: eye
on: [push, pull_request]
jobs:
  eye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Rust（almide の native ビルドに要る）
        run: rustup toolchain install stable --profile minimal
      - name: almide
        run: |
          curl -fsSL https://raw.githubusercontent.com/almide/almide/main/tools/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gramide（抽出器）
        run: almide install github.com/O6lvl4/gramide-cli --name gramide
      - name: テスト（契約テストを含む）
        run: almide test
      - name: ビルド
        run: almide build
      - name: 自分の眼を自分に
        run: ./ogumatic eye . --range HEAD~1..HEAD
